# Veritio — Self-hosted UX Research Platform
#
# Usage:
#   1. Copy .env.example to .env and fill in your values (including a generated
#      REDIS_PASSWORD; Compose intentionally has no shared default password)
#   2. Apply the external Supabase schema/migrations documented in the guide
#   3. docker compose up -d --build
#   4. docker compose ps (wait until every service is healthy)
#   5. Open http://localhost:4001
#
# Architecture:
#   - backend:  iii engine + step handlers on port 4000 (browser stream RBAC listener on 4004)
#   - frontend: Next.js app on port 4001
#   - yjs:      Yjs WebSocket server for real-time collaboration on port 4002
#   - redis:    iii state + stream backing store (the durable queue uses a
#               file-based store on a volume; see the backend service)
#
# Note: You need an external Supabase instance (hosted or self-hosted).
# Redis is included here for convenience.

services:
  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}",
      ]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/veritio/Dockerfile
    ports:
      - "4000:4000"
      - "4004:4004"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=4000
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - QUEUE_DATA_DIR=/app/apps/veritio/data/queue
      - YJS_SERVER_INTERNAL_URL=http://yjs:4002
    volumes:
      # Durable queue store (builtin file_based adapter) — persists queued
      # jobs across restarts/redeploys.
      - backend-queue:/app/apps/veritio/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "http://localhost:4000/api/health",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/veritio/Dockerfile.frontend
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:4001}
        NEXT_PUBLIC_REALTIME_SERVER_URL: ${NEXT_PUBLIC_REALTIME_SERVER_URL:-ws://localhost:4002}
        NEXT_PUBLIC_MOTIA_WS_URL: ${NEXT_PUBLIC_MOTIA_WS_URL:-ws://localhost:4004}
        NEXT_PUBLIC_PROXY_WORKER_URL: ${NEXT_PUBLIC_PROXY_WORKER_URL:-}
    ports:
      - "4001:4001"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=4001
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:4001}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:4001}
      - MOTIA_BACKEND_URL=http://backend:4000
      - YJS_SERVER_INTERNAL_URL=http://yjs:4002
    depends_on:
      backend:
        condition: service_healthy
      yjs:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://localhost:4001/health/ready');process.exit(r.ok?0:1)",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  yjs:
    build:
      context: .
      dockerfile: apps/veritio/Dockerfile.yjs
    ports:
      - "4002:4002"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=4002
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - YJS_INTERNAL_API_KEY=${YJS_INTERNAL_API_KEY:?Set YJS_INTERNAL_API_KEY in .env}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://localhost:4002/health/ready');process.exit(r.ok?0:1)",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  redis_data:
  backend-queue:
