# Veritio — Self-hosted UX Research Platform
#
# Usage:
#   1. Copy .env.example to .env and fill in your values
#   2. docker compose up -d
#   3. Open http://localhost:4001
#
# Architecture:
#   - backend:  iii engine + step handlers on port 4000 (browser stream RBAC listener on 4004)
#   - frontend: Next.js app on port 4001
#   - yjs:      Yjs WebSocket server for real-time collaboration on port 4002
#   - redis:    iii state + stream backing store (the durable queue uses a
#               file-based store on a volume; see the backend service)
#
# Note: You need an external Supabase instance (hosted or self-hosted).
# Redis is included here for convenience.

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-veritio-redis-dev}"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-veritio-redis-dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/veritio/Dockerfile
    ports:
      - "4000:4000"
    expose:
      - "4004"
    env_file: .env
    environment:
      - PORT=4000
      - REDIS_URL=redis://:${REDIS_PASSWORD:-veritio-redis-dev}@redis:6379
    volumes:
      # Durable queue store (builtin file_based adapter) — persists queued
      # jobs across restarts/redeploys.
      - backend-queue:/app/apps/veritio/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/veritio/Dockerfile.frontend
    ports:
      - "4001:4001"
    env_file: .env
    environment:
      - PORT=4001
      - NEXT_PUBLIC_APP_URL=http://localhost:4001
    depends_on:
      - backend
    restart: unless-stopped

  yjs:
    build:
      context: .
      dockerfile: apps/veritio/Dockerfile.yjs
    ports:
      - "4002:4002"
    env_file: .env
    environment:
      - PORT=4002
      - REDIS_URL=redis://:${REDIS_PASSWORD:-veritio-redis-dev}@redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  backend-queue:
