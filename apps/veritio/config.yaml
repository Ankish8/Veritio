# iii engine config (engine v0.22.x — pinned via scripts/install-iii.sh)
#
# ⚠️ NEVER run `iii` directly against this file. On boot the engine consumes
# `config:` blocks into its configuration store (./config/*.yaml), stripping
# them from the file it was given and expanding ${VAR:default} placeholders
# with the env AT THAT MOMENT. Boot scripts therefore:
#   1. wipe ./config/               (so every boot re-seeds from this file)
#   2. cp config.yaml .iii/config.runtime.yaml
#   3. iii --config .iii/config.runtime.yaml --no-update-check
# This keeps config.yaml the single committed source of truth and makes env
# var changes deterministic across deploys.
#
# Layout (all bind on localhost unless noted):
#   :4000  http                public HTTP API (all step routes)
#   :4004  iii-worker-manager  public RBAC-gated WS (browser stream clients)
#   :4014  iii-stream          internal stream worker (storage/pub-sub)
#   :49134 iii-worker-manager  trusted worker bridge (app bundle) — NEVER public
#
# The compiled backend (dist/backend.mjs) connects to ws://localhost:49134
# (III_URL) and registers every step's functions/triggers at startup.

workers:
  # HTTP server — serves all registered step routes
  - name: http
    config:
      host: 0.0.0.0
      port: ${PORT:4000}
      default_timeout: 30000
      cors:
        # Dev-only origins: prod browser traffic is same-origin via Next.js
        # rewrites (Vercel), and snippet CORS is handled by the Cloudflare
        # proxy worker — the engine never needs prod origins here.
        allowed_origins:
          - http://localhost:3113   # iii console (dev UI)
          - http://127.0.0.1:3113
          - http://localhost:4001   # Next.js dev
        allowed_methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS

  # Durable queue — builtin file-based adapter: full retries/FIFO/DLQ on a
  # single instance. (The redis adapter lacks named-queue consumption/retries/
  # DLQ; revisit rabbitmq if we ever go multi-instance.)
  # In prod, ./data lives on a Railway persistent volume so queued jobs
  # survive deploys.
  # NOTE: registry worker names are empirical — queue/state resolve
  # UNPREFIXED, while http/stream/cron/observability use the iii- prefix.
  # A wrong name silently leaves the worker running on defaults (in-memory).
  - name: queue
    config:
      adapter:
        name: builtin
        config:
          store_method: file_based
          file_path: ${QUEUE_DATA_DIR:./data/queue}

  # State — Redis-backed (cross-step ephemeral storage: assistant cancel
  # flags, analytics caches). Parity with the previous StateModule.
  - name: state
    config:
      adapter:
        name: redis
        config:
          redis_url: ${REDIS_URL:redis://localhost:6379}

  # Stream storage/pub-sub — Redis-backed. The WS port here is loopback-only:
  # browsers connect through the RBAC listener below (direct stream-port
  # connections are deprecated).
  - name: iii-stream
    config:
      host: 127.0.0.1
      port: 4014
      auth_function: veritio::stream::auth
      adapter:
        name: redis
        config:
          redis_url: ${REDIS_URL:redis://localhost:6379}

  # Trusted worker listener — the app bundle's bridge. Declaring any
  # iii-worker-manager replaces the engine's default listener, so this entry
  # is mandatory. Loopback-only: it accepts unauthenticated workers.
  - name: iii-worker-manager
    config:
      host: 127.0.0.1
      port: 49134

  # Public browser listener (RBAC-gated) — same public port the old stream
  # WS used, so NEXT_PUBLIC_MOTIA_WS_URL / Railway domain mapping / CSP all
  # stay unchanged. veritio::stream::auth validates the ?token= JWT (or
  # allows anonymous with empty context — parity with the old onJoin model).
  - name: iii-worker-manager
    config:
      host: 0.0.0.0
      port: 4004
      rbac:
        auth_function_id: veritio::stream::auth
        # Browsers only consume streams; they may not register functions or
        # call app/step functions. Exact stream-op allowlist finalized during
        # browser-sdk integration (P3).
        expose_functions: []

  # Cron scheduler (15 step schedules, 7-field expressions)
  - name: cron

  # OpenTelemetry observability — memory exporter surfaces data in `iii
  # console`; switch exporter to otlp for Grafana/Datadog.
  - name: iii-observability
    config:
      enabled: ${OTEL_ENABLED:false}
      service_name: ${OTEL_SERVICE_NAME:veritio-dev}
      exporter: ${OTEL_EXPORTER_TYPE:memory}
