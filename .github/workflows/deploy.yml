name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      BUN_INSTALL: /home/ankish/.bun
      PATH: /home/ankish/.bun/bin:/usr/local/bin:/usr/bin:/bin

    steps:
      - name: Pull latest code
        working-directory: /home/ankish/veritio
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Install dependencies
        working-directory: /home/ankish/veritio
        run: bun install --frozen-lockfile

      - name: Build backend
        working-directory: /home/ankish/veritio/apps/veritio
        run: bun run --bun motia-iii build

      - name: Load environment
        run: |
          # Export all vars from .env so NEXT_PUBLIC_* vars get baked into the JS bundle
          set -a
          source /home/ankish/veritio/.env
          set +a
          # Save to GITHUB_ENV so subsequent steps inherit them
          while IFS='=' read -r key value; do
            [[ -z "$key" || "$key" == \#* ]] && continue
            echo "$key=$value" >> "$GITHUB_ENV"
          done < /home/ankish/veritio/.env

      - name: Verify critical env vars
        run: |
          if [[ "$NEXT_PUBLIC_APP_URL" == *"localhost"* ]] || [[ -z "$NEXT_PUBLIC_APP_URL" ]]; then
            echo "❌ NEXT_PUBLIC_APP_URL is missing or contains localhost: '$NEXT_PUBLIC_APP_URL'"
            echo "   This would bake localhost into the client bundle. Aborting."
            exit 1
          fi
          echo "✅ NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL"

      - name: Build frontend
        working-directory: /home/ankish/veritio/apps/veritio
        run: bun run --bun next build

      - name: Restart services
        run: |
          sudo systemctl restart veritio-backend
          sudo systemctl restart veritio-frontend
          sudo systemctl restart veritio-yjs

      - name: Health check
        run: |
          echo "Waiting for services to start..."
          sleep 10

          # Check frontend
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4001/)
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "307" ]; then
            echo "✅ Frontend is healthy (HTTP $HTTP_CODE)"
          else
            echo "❌ Frontend returned HTTP $HTTP_CODE"
            sudo journalctl -u veritio-frontend --since "1 minute ago" --no-pager | tail -20
            exit 1
          fi

          # Check backend
          sleep 5
          BACKEND=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/)
          echo "Backend status: HTTP $BACKEND"

          # Check all services are active
          for svc in veritio-backend veritio-frontend veritio-yjs; do
            STATUS=$(systemctl is-active $svc)
            if [ "$STATUS" = "active" ]; then
              echo "✅ $svc is $STATUS"
            else
              echo "❌ $svc is $STATUS"
              sudo journalctl -u $svc --since "1 minute ago" --no-pager | tail -20
              exit 1
            fi
          done

          echo ""
          echo "🚀 Deployment complete!"
